<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playing cards — DOM</title>
    <link rel="stylesheet" href="cards.css">
    <script src="cards.js" type="module"></script>
</head>
<body>
    <main>
        <h1>Playing cards</h1>
        <p>Program the buttons to select the matching cards.</p>
 
        <div class="controls" role="group" aria-label="Card selection">
            <button id="select-ace-spade">A · Ace of spades</button>
            <button id="select-hearts">B · Hearts</button>
            <button id="select-red">C · Red cards</button>
            <button id="select-face-cards">D · Face cards</button>
            <button id="select-red-face-cards">E · Red face cards</button>
            <button id="select-not-spades">F · All except spades</button>
        </div>
 
        <div class="deck" aria-label="Deck of 52 cards">
            <playing-card id="HEART-ACE" class="ace heart">
                <span class="rank">A</span>
                <span class="suit">♥</span>
            </playing-card>
            <playing-card id="HEART-2" class="2 heart">
                <span class="rank">2</span>
                <span class="suit">♥</span>
            </playing-card>
            <playing-card id="HEART-3" class="3 heart">
                <span class="rank">3</span>
                <span class="suit">♥</span>
            </playing-card>
            <playing-card id="HEART-4" class="4 heart">

            </playing-card>
            <playing-card id="HEART-5" class="5 heart">

            <playing-card id="HEART-6" class="6 heart">

            <playing-card id="HEART-9" class="9 heart">

            <playing-card id="HEART-JACK" class="jack heart" data-face-card>

                <span class="suit">♥</span>
            </playing-card>
            <playing-card id="HEART-QUEEN" class="queen heart" data-face-card>
                <span class="rank">Q</span>

            <playing-card id="HEART-KING" class="king heart" data-face-card>

            <playing-card id="SPADE-ACE" class="ace spade">

            <playing-card id="DIAMOND-JACK" class="jack diamond" data-face-card>

            <playing-card id="DIAMOND-QUEEN" class="queen diamond" data-face-card>

            <playing-card id="DIAMOND-KING" class="king diamond" data-face-card>
                <span class="rank">K</span>
                <span class="suit">♦</span>
            </playing-card>
        </div>
        <h2>Draw a hand</h2>
        <div class="controls">
            <button id="draw-hand">Draw a hand</button>
        </div>
        <div id="hand" class="hand" aria-label="Hand of five cards"></div>
    </main>
</body>
</html>
